name: Production Deployment

on:
  pull_request:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # ENV
      - name: Create backend .env
        run: |
          echo "MOCK_ENV=${{ secrets.MOCK_ENV }}" >> backend/.env

      # BUILD IMAGES
      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devop_frontend:latest ./frontend

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devop_backend:latest ./backend

      # PUSH IMAGES
      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/devop_frontend:latest

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/devop_backend:latest
